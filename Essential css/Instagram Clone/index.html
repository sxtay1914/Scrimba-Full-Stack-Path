<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <img class="logo" src="images/logo.png">
            <!-- avatar -->
            <img class="user-avatar" src="images/user-avatar.png">
        </header>
        
        <section>
            <!-- post section -->
            <div class="post-container">
                <img class="post-avatar" src="images/avatar-vangogh.jpg">
                <div>
                    <p class="bold-w">Vincent van Gogh</p>
                    <p>Zudert, Netherlands</p>
                </div>
            </div>
            
            <div>
                <img class="post-img" src="images/post-vangogh.jpg">
            </div>
        </section>
        
        <footer>
            <div class="icons-container">
                <img class="icon" src="images/icon-heart.png">
                <img class="icon" src="images/icon-comment.png">
                <img class="icon" src="images/icon-dm.png">
            </div>     
            <p class="likes bold-w">21 likes</p>
            <p class="comment"><span class="bold-w">vincey1853</span> just took a few mushrooms lol</p>
        </footer>
        <script src="index.js"></script>
    </body>
</html>
