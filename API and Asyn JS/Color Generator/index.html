<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main>
            <form class="top-section" id="top-section">
                <input type="color" name="color" required>
                <select name="scheme" required>
                    <option value="monochrome">Monochrome</option>
                    <option value="monochrome-dark">Monochrome-dark</option>
                    <option value="monochrome-light">Monochrome-light</option>
                    <option value="analogic">Analogic</option>
                    <option value="complement">Complement</option>
                    <option value="analogic-complement">Analogic-complement</option>
                    <option value="triad">Triad</option>
                    <option value="quad">Quad</option>
                </select>
                <button type="submit" class="btn">Get color scheme</button>
            </form>
            <section class="color-sec" id="color-sec">
                <!-- color generated -->
                <div class="copy-box" id="s1" data-copy=""></div>
                <div class="copy-box" id="s2" data-copy=""></div>
                <div class="copy-box" id="s3" data-copy=""></div>
                <div class="copy-box" id="s4" data-copy=""></div>
                <div class="copy-box" id="s5" data-copy=""></div>
                <div class="copy-box" id="d1" data-copy=""></div>
                <div class="copy-box" id="d2" data-copy=""></div>
                <div class="copy-box" id="d3" data-copy=""></div>
                <div class="copy-box" id="d4" data-copy=""></div>
                <div class="copy-box" id="d5" data-copy=""></div>
            </section>
        </main>
        <script src="index.js" type="module"></script>
    </body>
</html>
