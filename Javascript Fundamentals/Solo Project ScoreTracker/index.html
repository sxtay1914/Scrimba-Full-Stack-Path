<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class="black-box" id="home-count">0</div>
                <div class="three-buttons">
                    <button class="button" onclick="add('home', 1)">+1</button>
                    <button class="button" onclick="add('home', 2)">+2</button>
                    <button class="button" onclick="add('home', 3)">+3</button>
                </div>
            </div>
            <div>
                <h3>GUEST</h3>
                <div class="black-box" id="guest-count">0</div>
                <div class="three-buttons">
                    <button class="button" onclick="add('guest', 1)">+1</button>
                    <button class="button" onclick="add('guest', 2)">+2</button>
                    <button class="button" onclick="add('guest', 3)">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
